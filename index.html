<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>الكعبة المشرفة - الواقع المعزز</title>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.1.0/model-viewer.min.js"></script>
<style>
body{margin:0;background:#f8f3e8;font-family:Tahoma,Arial;text-align:center;color:#302414}
h1{margin:18px 0 6px}
p{margin:8px 14px}
model-viewer{width:100%;height:65vh;background:linear-gradient(#f5f0e7,#e4d6c3)}
button{border:0;border-radius:25px;background:#806016;color:white;font-size:18px;padding:14px 24px;cursor:pointer}
.hint{font-size:14px}
</style>
</head>
<body>
<h1>🕋 الكعبة المشرفة</h1>
<p>تجربة تعليمية لدرس حج بيت الله الحرام</p>
<model-viewer src="kaaba.glb" ios-src="kaaba.usdz" alt="مجسم ثلاثي الأبعاد للكعبة المشرفة" camera-controls auto-rotate ar ar-modes="webxr scene-viewer quick-look" shadow-intensity="1" exposure="1" touch-action="pan-y">
<button slot="ar-button">📱 عرض الكعبة أمامي بالواقع المعزز</button>
</model-viewer>
<p class="hint">حرّكي الجوال ببطء نحو أرضية واضحة ثم ضعي المجسم على الأرض. يعتمد تشغيل الواقع المعزز على دعم الجهاز والمتصفح.</p>
